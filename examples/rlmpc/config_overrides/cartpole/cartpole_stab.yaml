task_config:
  seed: 42
  ctrl_freq: 15
  pyb_freq: 750
  physics: pyb

  # state initialization
  init_state:
    init_x: 0.1
    init_x_dot: -0.5
    init_theta: -0.1
    init_theta_dot: 0.0
  randomized_init: False
  randomized_inertial_prop: False
  normalized_rl_action_space: True

  init_state_randomization_info:
    init_x:
      distrib: "uniform"
      low: -1
      high: 1
    init_x_dot:
      distrib: "uniform"
      low: -0.1
      high: 0.1
    init_theta:
      distrib: "uniform"
      low: -0.2
      high: 0.2
    init_theta_dot:
      distrib: "uniform"
      low: -0.1
      high: 0.1

  task: stabilization
  task_info:
    stabilization_goal: [0.7, 0]
    stabilization_goal_tolerance: 0.05

  inertial_prop:
    pole_length: 0.5
    cart_mass: 1
    pole_mass: 0.1

  episode_len_sec: 10
  cost: quadratic
  obs_goal_horizon: 1

  # RL Reward
  rew_state_weight: [1, 1, 1, 1]
  rew_act_weight: 0.1
  rew_exponential: True

  # constraints
  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
      # upper_bounds:
      #   - 20
      #   - 20
      #   - 0.58
      #   - 20
      # lower_bounds:
      #   - -20
      #   - -20
      #   - -0.58
      #   - -20
    - constraint_form: default_constraint
      constrained_variable: input
  done_on_out_of_bound: True
  done_on_violation: False
