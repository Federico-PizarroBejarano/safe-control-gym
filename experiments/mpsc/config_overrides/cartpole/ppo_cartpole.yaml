algo: ppo
algo_config:
  # model args
  hidden_dim: 32
  activation: 'leaky_relu'
  norm_obs: False
  norm_reward: False
  clip_obs: 10.0
  clip_reward: 10.0

  # loss args
  gamma: 0.98
  use_gae: False
  gae_lambda: 0.8
  use_clipped_value: True
  clip_param: 0.1
  target_kl: 0.01
  entropy_coef: 0.0001

  # optim args
  opt_epochs: 5
  mini_batch_size: 150
  actor_lr: 0.0007948148615930024
  critic_lr: 0.007497368468753617
  max_grad_norm: 0.5

  # runner args
  max_env_steps: 300000
  num_workers: 1
  rollout_batch_size: 1
  rollout_steps: 600
  deque_size: 10
  eval_batch_size: 10

  # misc
  log_interval: 6000
  save_interval: 0
  num_checkpoints: 0
  eval_interval: 6000
  eval_save_best: True
  tensorboard: False

  # safety filter
  filter_train_actions: True
  penalize_sf_diff: False
  sf_penalty: 1
  use_safe_reset: True
