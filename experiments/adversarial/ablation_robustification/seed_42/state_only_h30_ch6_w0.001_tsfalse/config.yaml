algo: ppo
algo_config:
  activation: tanh
  actor_lr: 0.0003
  adv_cart_threshold: 0.8
  adv_correction_bonus_tier1: 1.0
  adv_correction_bonus_tier2: 2.0
  adv_correction_bonus_tier3: 5.0
  adv_no_correction_penalty: -3.0
  adv_reward_exponential: false
  adv_reward_scale: 1.0
  adv_reward_temperature: 15.0
  adv_stability_penalty: -5.0
  adv_stability_threshold: 0.1
  adv_training: true
  adv_use_cart_penalty: true
  adv_use_correction_bonus: false
  adv_use_correction_ratio: false
  adv_use_correction_reward: false
  adv_use_no_correction_penalty: false
  adv_use_oscillation_reward: true
  adv_use_stability_penalty: true
  adv_use_theta_reward: true
  adv_use_velocity_reward: true
  adv_w_cart: 2.0
  adv_w_correction: 30.0
  adv_w_correction_ratio: 40.0
  adv_w_oscillation: 2.0
  adv_w_theta: 5.0
  adv_w_velocity: 3.0
  clip_obs: 10.0
  clip_param: 0.2
  clip_reward: 10.0
  critic_lr: 0.001
  deque_size: 10
  entropy_coef: 0.01
  eval_batch_size: 10
  eval_interval: 2000
  eval_save_best: true
  filter_train_actions: true
  gae_lambda: 0.95
  gamma: 0.99
  hidden_dim: 64
  log_interval: 1000
  max_env_steps: 100000
  max_grad_norm: 0.5
  mini_batch_size: 64
  norm_obs: false
  norm_reward: false
  num_checkpoints: 0
  num_workers: 1
  opt_epochs: 10
  penalize_sf_diff: false
  rollout_batch_size: 1
  rollout_steps: 100
  save_interval: 2000
  sf_penalty: 1
  target_kl: 0.01
  tensorboard: false
  training: true
  use_adv_reward: true
  use_clipped_value: false
  use_gae: true
  use_safe_reset: true
device: cpu
kv_overrides:
- algo_config.adv_use_correction_reward=False
- algo_config.adv_use_correction_ratio=False
- algo_config.adv_use_correction_bonus=False
- algo_config.adv_use_no_correction_penalty=False
- sf_config.horizon=30
- sf_config.mpsc_cost_horizon=6
- sf_config.max_w=0.001
- sf_config.use_terminal_set=false
output_dir: ./ablation_robustification/seed_42/state_only_h30_ch6_w0.001_tsfalse
overrides:
- ./config_overrides/cartpole/ppo_cartpole.yaml
- ./config_overrides/cartpole/cartpole_track.yaml
- ./config_overrides/cartpole/nl_mpsc_cartpole.yaml
restore: null
safety_filter: nl_mpsc
seed: 42
sf_config:
  cost_function: one_step_cost
  decay_factor: 0.85
  horizon: 30
  integration_algo: rk4
  max_w: 0.001
  mpsc_cost_horizon: 6
  prior_info:
    prior_prop: null
    prior_prop_rand_info: null
    randomize_prior_prop: false
  q_lin:
  - 0.02
  - 0.001
  - 10
  - 0.5
  r_lin:
  - 0.1
  slack_cost: 300
  soften_constraints: true
  use_acados: true
  use_terminal_set: 'false'
  warmstart: true
tag: temp
task: cartpole
task_config:
  adversary_disturbance: null
  adversary_disturbance_offset: 0.0
  adversary_disturbance_scale: 0.01
  constraint_penalty: -1
  constraints:
  - constrained_variable: state
    constraint_form: default_constraint
    lower_bounds:
    - -2
    - -2
    - -0.16
    - -2
    upper_bounds:
    - 2
    - 2
    - 0.16
    - 2
  - constrained_variable: input
    constraint_form: default_constraint
  cost: rl_reward
  ctrl_freq: 15
  disturbances: null
  done_on_out_of_bound: true
  done_on_violation: false
  episode_len_sec: 10
  gui: false
  inertial_prop:
    cart_mass: 1
    pole_length: 0.5
    pole_mass: 0.1
  inertial_prop_randomization_info: null
  init_state:
    init_theta: 0
    init_theta_dot: 0
    init_x: 0
    init_x_dot: 0
  init_state_randomization_info:
    init_theta:
      distrib: uniform
      high: 0.2
      low: -0.2
    init_theta_dot:
      distrib: uniform
      high: 0.1
      low: -0.1
    init_x:
      distrib: uniform
      high: 1
      low: -1
    init_x_dot:
      distrib: uniform
      high: 0.1
      low: -0.1
  normalized_rl_action_space: true
  obs_goal_horizon: 1
  obs_wrap_angle: false
  physics: pyb
  pyb_freq: 750
  randomized_inertial_prop: false
  randomized_init: true
  rew_act_weight: 0.01
  rew_exponential: true
  rew_state_weight:
  - 1
  - 0.01
  - 0.01
  - 0.01
  seed: 42
  task: traj_tracking
  task_info:
    num_cycles: 2
    stabilization_goal:
    - 0
    - 0
    stabilization_goal_tolerance: 0.05
    trajectory_plane: zx
    trajectory_position_offset:
    - 0
    - 0
    trajectory_scale: 1
    trajectory_type: circle
  use_constraint_penalty: false
  verbose: false
use_gpu: false
