algo: sac
algo_config:
  # model args
  hidden_dim: 128
  use_entropy_tuning: False

  # optim args
  train_interval: 100
  train_batch_size: 256
  actor_lr: 0.001
  critic_lr: 0.001
  entropy_lr: 0.001

  # runner args
  max_env_steps: 300000
  warm_up_steps: 1000
  rollout_batch_size: 1
  num_workers: 1
  max_buffer_size: 1000000
  deque_size: 10
  eval_batch_size: 10

  # misc
  log_interval: 4000
  save_interval: 0
  num_checkpoints: 0
  eval_interval: 4000
  eval_save_best: True
  tensorboard: False

  # Safety filter training
  filter_train_actions: True
  penalize_sf_diff: True
  sf_penalty: 300
  use_safe_reset: True

  # Adversarial reward config
  adv_reward_temperature: 15.0
  adv_reward_scale: 1.0
  adv_reward_exponential: False

  # Correction-based rewards
  adv_use_correction_reward: True
  adv_w_correction: 30.0
  adv_use_correction_ratio: True
  adv_w_correction_ratio: 40.0
  adv_use_correction_bonus: True
  adv_correction_bonus_tier1: 1.0
  adv_correction_bonus_tier2: 2.0
  adv_correction_bonus_tier3: 5.0
  adv_use_no_correction_penalty: True
  adv_no_correction_penalty: -3.0

  # State-based rewards - adapted for quadrotor
  adv_use_theta_reward: True
  adv_w_theta: 8.0
  adv_use_velocity_reward: True
  adv_w_velocity: 4.0
  adv_use_oscillation_reward: True
  adv_w_oscillation: 3.0

  # Penalties - adapted for quadrotor
  adv_use_cart_penalty: False
  adv_w_cart: 0.0
  adv_cart_threshold: 0.0
  adv_use_stability_penalty: True
  adv_stability_threshold: 0.15
  adv_stability_penalty: -8.0

  # Quadrotor-specific rewards
  adv_use_altitude_penalty: True
  adv_w_altitude: 5.0
  adv_altitude_threshold: 0.3
  adv_use_position_reward: True
  adv_w_position: 3.0
