algo: ppo
algo_config:
  # model args
  hidden_dim: 128
  activation: tanh
  norm_obs: False
  norm_reward: False
  clip_obs: 10.0
  clip_reward: 10.0

  # loss args
  gamma: 0.99
  use_gae: True
  gae_lambda: 0.95
  use_clipped_value: False
  clip_param: 0.2
  target_kl: 0.01
  entropy_coef: 0.01

  # optim args
  opt_epochs: 20
  mini_batch_size: 250
  actor_lr: 0.001
  critic_lr: 0.001
  max_grad_norm: 0.5

  # runner args
  max_env_steps: 500000
  num_workers: 1
  rollout_batch_size: 1
  rollout_steps: 1000
  deque_size: 10
  eval_batch_size: 10

  # misc
  log_interval: 10000
  save_interval: 0
  num_checkpoints: 0
  eval_interval: 10000
  eval_save_best: True
  tensorboard: False

  # Safety filter training
  filter_train_actions: True
  use_safe_reset: True

  adversary_strategy: adversary
  adversarial_reward:
    temperature: 15.0
    use_correction_reward: True
    use_correction_ratio: True
    use_correction_bonus: True
    use_no_correction_penalty: True
    use_theta_reward: True
    use_velocity_reward: True
    use_oscillation_reward: True
    use_cart_penalty: False
    use_stability_penalty: True
    use_altitude_penalty: True
    use_position_reward: True
    w_correction: 30.0
    w_correction_ratio: 40.0
    w_theta: 8.0
    w_velocity: 4.0
    w_oscillation: 3.0
    w_altitude: 5.0
    w_position: 3.0
    w_cart_penalty: 0.0
    w_termination_penalty: 100.0
    correction_bonus_tier1: 1.0
    correction_bonus_tier2: 2.0
    correction_bonus_tier3: 5.0
    no_correction_penalty: -3.0
    altitude_threshold: 0.3
    quad_stability_penalty: -8.0
    plant_family: quadrotor_2d
