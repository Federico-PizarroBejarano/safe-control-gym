task_config:
  seed: 42
  ctrl_freq: 50
  pyb_freq: 1000
  physics: pyb
  quad_type: 2
  normalized_rl_action_space: True

  # State initialization
  init_state:
    init_x: 0
    init_x_dot: 0
    init_z: 1
    init_z_dot: 0
    init_theta: 0
    init_theta_dot: 0
  randomized_init: True
  randomized_inertial_prop: False

  init_state_randomization_info:
    init_x:
      distrib: 'uniform'
      low: -1.5
      high: 1.5
    init_x_dot:
      distrib: 'uniform'
      low: -0.5
      high: 0.5
    init_z:
      distrib: 'uniform'
      low: 0.5
      high: 1.5
    init_z_dot:
      distrib: 'uniform'
      low: -0.5
      high: 0.5
    init_theta:
      distrib: 'uniform'
      low: -0.15
      high: 0.15
    init_theta_dot:
      distrib: 'uniform'
      low: -0.5
      high: 0.5

  task: traj_tracking
  task_info:
    trajectory_type: figure8
    num_cycles: 1
    trajectory_plane: 'xz'
    trajectory_position_offset: [0, 1]
    trajectory_scale: 0.8

  inertial_prop:
    M: 0.027
    Iyy: 1.4e-05

  episode_len_sec: 10
  cost: rl_reward
  obs_goal_horizon: 1

  # RL Reward
  rew_state_weight: [1, 0.01, 1, 0.01, 0.01, 0.01]
  rew_act_weight: 0.01
  rew_exponential: True

  # Constraints - state order: [x, x_dot, z, z_dot, theta, theta_dot]
  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
      upper_bounds:
        - 2.5
        - 2
        - 2.5
        - 2
        - 0.25
        - 2
      lower_bounds:
        - -2.5
        - -2
        - 0.1
        - -2
        - -0.25
        - -2
    - constraint_form: default_constraint
      constrained_variable: input
      upper_bounds:
        - 0.29
        - 0.29
      lower_bounds:
        - 0.06
        - 0.06
  done_on_out_of_bound: True
  done_on_violation: False
