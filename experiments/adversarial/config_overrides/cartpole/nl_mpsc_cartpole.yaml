safety_filter: nl_mpsc
sf_config:
  # LQR controller parameters
  r_lin:
    - 0.1

  q_lin:
    - 0.02
    - 0.001
    - 10
    - 0.5

  # MPC parameters
  use_acados: True
  horizon: 30
  warmstart: True
  integration_algo: rk4
  use_terminal_set: True

  # Prior info
  prior_info:
    prior_prop: null
    randomize_prior_prop: False
    prior_prop_rand_info: null

  # Cost function
  cost_function: learned_cost
  mpsc_cost_horizon: 5
  decay_factor: 1

  # Softening
  soften_constraints: True
  slack_cost: 300

  max_w: [0.002, 0.002, 0.01, 0.002, 0.0]
