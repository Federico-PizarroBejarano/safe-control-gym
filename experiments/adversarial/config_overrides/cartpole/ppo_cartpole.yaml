algo: ppo
algo_config:
  # model args
  hidden_dim: 64
  activation: tanh
  norm_obs: False
  norm_reward: False
  clip_obs: 10.0
  clip_reward: 10.0

  # loss args
  gamma: 0.99
  use_gae: True
  gae_lambda: 0.95
  use_clipped_value: False
  clip_param: 0.2
  target_kl: 0.01
  entropy_coef: 0.01

  # optim args
  opt_epochs: 10
  mini_batch_size: 64
  actor_lr: 0.0003
  critic_lr: 0.001
  max_grad_norm: 0.5

  # runner args
  max_env_steps: 100000
  num_workers: 1
  rollout_batch_size: 1
  rollout_steps: 100
  deque_size: 10
  eval_batch_size: 10

  # misc
  log_interval: 1000
  save_interval: 2000
  num_checkpoints: 0
  eval_interval: 2000
  eval_save_best: True
  tensorboard: False

  # Safety filter training
  filter_train_actions: True
  penalize_sf_diff: False
  sf_penalty: 1
  use_safe_reset: True

  # Adversarial reward config
  use_adv_reward: True

  # Correction-based rewards
  adv_use_correction_reward: False
  adv_w_correction: 3.0
  adv_use_correction_ratio: True
  adv_w_correction_ratio: 4.0

  # State-based rewards
  adv_use_theta_reward: True
  adv_w_theta: 5.0
  adv_use_velocity_reward: True
  adv_w_velocity: 3.0
  adv_use_oscillation_reward: False
  adv_w_oscillation: 2.0

  # Termination penalty
  adv_use_termination_penalty: True
  adv_w_termination_penalty: 10.0

  # Constraint violation reward
  adv_use_constraint_violation_reward: True
  adv_w_constraint_violation_reward: 10.0
