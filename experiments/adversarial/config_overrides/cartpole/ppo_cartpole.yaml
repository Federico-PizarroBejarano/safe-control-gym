algo: ppo
algo_config:
  # model args
  hidden_dim: 32
  activation: 'leaky_relu'
  norm_obs: False
  norm_reward: False
  clip_obs: 10.0
  clip_reward: 10.0

  # loss args
  gamma: 0.98
  use_gae: False
  gae_lambda: 0.8
  use_clipped_value: True
  clip_param: 0.1
  target_kl: 0.01
  entropy_coef: 0.0001

  # optim args
  opt_epochs: 5
  mini_batch_size: 150
  actor_lr: 0.0007948148615930024
  critic_lr: 0.007497368468753617
  max_grad_norm: 0.5

  # runner args
  max_env_steps: 300000
  num_workers: 1
  rollout_batch_size: 1
  rollout_steps: 600
  deque_size: 10
  eval_batch_size: 10

  # misc
  log_interval: 6000
  save_interval: 0
  num_checkpoints: 0
  eval_interval: 6000
  eval_save_best: True
  tensorboard: False

  # Safety filter training
  filter_train_actions: True
  penalize_sf_diff: False
  sf_penalty: 1
  use_safe_reset: True

  adversary_strategy: adversary
  adversarial_reward:
    temperature: 15.0
    use_correction_reward: True
    use_correction_ratio: True
    use_correction_bonus: True
    use_no_correction_penalty: True
    use_theta_reward: True
    use_velocity_reward: True
    use_oscillation_reward: True
    use_cart_penalty: True
    use_stability_penalty: True
    w_correction: 30.0
    w_correction_ratio: 40.0
    w_theta: 5.0
    w_velocity: 3.0
    w_oscillation: 2.0
    w_cart_penalty: 2.0
    w_termination_penalty: 100.0
    correction_bonus_tier1: 1.0
    correction_bonus_tier2: 2.0
    correction_bonus_tier3: 5.0
    no_correction_penalty: -3.0
    cart_threshold: 0.8
    stability_penalty: -5.0
    plant_family: cartpole
