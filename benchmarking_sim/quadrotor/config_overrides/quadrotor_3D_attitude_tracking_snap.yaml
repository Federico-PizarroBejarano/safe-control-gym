task_config:
  ctrl_freq: 60
  pyb_freq: 60
  physics: dyn_si_3d
  quad_type: 6
  # quad_type: 9
  # normalized_rl_action_space: False
  init_state:
    init_x: 0
    init_x_dot: 0
    init_z: 1.0
    init_z_dot: 0
  # obstacle course should be within
  # x: [-3, 3]
  # y: [-2, 2]
  # z: [0, 2.5]
  task: traj_tracking
  task_info:
    trajectory_type: snap_custom
    num_cycles: 2
    trajectory_plane: 'xy'
    trajectory_position_offset: [ 0., 0.]
    trajectory_scale: 1.
    # strings:
    #   - start: [1.0, 0.0, 1.4]
    #     end: [1.0, 0.0, 0.05]
    #   - start: [0.5, -1.0, 1.4]
    #     end: [0.5, -1.0, 0.05]
    #   - start: [0.0, 1.5, 1.4]
    #     end: [0.0, 1.5, 0.05]
    #   - start: [0.0, 1.5, 1.4]
    #     end: [0.0, 1.5, 0.05]

    waypoints:
      - time: 0
        position: [1.0, 1.5, 0.05]
      - time: 2
        position: [0.8, 1.0, 0.2]
      - time: 3
        position: [0.55, -0.3, 0.5]
      - time: 4
        position: [0.2, -1.3, 0.65]
      - time: 5
        position: [1.1, -0.85, 1.1]
      - time: 6
        position: [0.2, 0.5, 0.65]
      - time: 7
        position: [0.0, 1.2, 0.525]
      - time: 8
        position: [0.0, 1.2, 1.1]
      - time: 9
        position: [-0.5, 0.0, 1.1]
      - time: 10
        position: [-0.5, -0.5, 1.1]

  inertial_prop:
    M: 0.033

  episode_len_sec: 11
  # cost: rl_reward
  cost: quadratic
  constraints:
    - constraint_form: default_constraint
      constrained_variable: state
    - constraint_form: default_constraint
      constrained_variable: input
  done_on_violation: False
